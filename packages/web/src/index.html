<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06090f" />

    <!--
      Apply the saved theme before first paint so light-theme users don't flash
      the default dark palette while the app boots (index.tsx awaits IndexedDB
      first). Runs pre-module, so the key + colors are hard-coded here; keep them
      in sync with settings/theme/theme.constants.ts. Dark is the CSS default,
      so only a non-default choice needs touching.
    -->
    <script>
      try {
        if (localStorage.getItem("compass.theme") === "light-beach") {
          document.documentElement.setAttribute("data-theme", "light-beach");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f3eee2");
        }
      } catch {}
    </script>

    <title>Compass Calendar</title>
    <meta
      name="description"
      content="Compass is a small but mighty calendar for busy minimalists — a simple, keyboard-first way to plan your week around what matters."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.compasscalendar.com/" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Compass Calendar" />
    <meta
      property="og:title"
      content="Compass Calendar — simple, keyboard-first weekly planning"
    />
    <meta
      property="og:description"
      content="A small but mighty calendar for busy minimalists. Plan your week around what matters."
    />
    <meta property="og:url" content="https://www.compasscalendar.com/" />
    <meta
      property="og:image"
      content="https://www.compasscalendar.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Compass Calendar — simple, keyboard-first weekly planning"
    />
    <meta
      name="twitter:description"
      content="A small but mighty calendar and to-do app for busy minimalists. Plan your week around what matters — simply."
    />
    <meta
      name="twitter:image"
      content="https://www.compasscalendar.com/og-image.png"
    />

    <!-- Structured data for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Compass Calendar",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.compasscalendar.com/",
        "description": "Compass is a small but mighty calendar for busy minimalists — a simple, keyboard-first way to plan your week around what matters.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />

    <!--
      Bun names the src/index.tsx entrypoint's outputs after the entry file
      (/index.js + /index.css), so this file can reference them statically.
      copy-static-assets.ts asserts both exist at build time.

      The built copy of this file additionally gets modulepreload links for
      every boot-critical chunk, appended to head by inject-module-preloads.ts.
    -->
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
