<!doctype html>
<html lang="en" data-theme="light-beach">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3eee2" />

    <!--
      Apply a stored dark theme before first paint so those visitors don't
      flash the default light palette while the app boots (index.tsx awaits
      IndexedDB first). Runs pre-module, so the key + colors are hard-coded
      here; keep them in sync with settings/theme/theme.constants.ts and
      settings/theme/theme.util.ts. Light is the CSS default, so only dark
      needs touching. An explicit stored choice wins.
    -->
    <script>
      try {
        const stored = localStorage.getItem("compass.theme");
        if (stored === "dark-abyss") {
          document.documentElement.setAttribute("data-theme", "dark-abyss");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#06090f");
        }
      } catch {}
    </script>

    <title>Compass Calendar</title>
    <meta
      name="description"
      content="Compass is a small but mighty calendar for busy minimalists: a simple, keyboard-first way to plan your week around what matters."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.compasscalendar.com/" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Compass Calendar" />
    <meta
      property="og:title"
      content="Compass Calendar: simple, keyboard-first weekly planning"
    />
    <meta
      property="og:description"
      content="A small but mighty calendar for busy minimalists. Plan your week around what matters."
    />
    <meta property="og:url" content="https://www.compasscalendar.com/" />
    <meta
      property="og:image"
      content="https://www.compasscalendar.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Compass Calendar: simple, keyboard-first weekly planning"
    />
    <meta
      name="twitter:description"
      content="A small but mighty calendar and to-do app for busy minimalists. Plan your week around what matters, simply."
    />
    <meta
      name="twitter:image"
      content="https://www.compasscalendar.com/og-image.png"
    />

    <!-- Structured data for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Compass Calendar",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.compasscalendar.com/",
        "description": "Compass is a small but mighty calendar for busy minimalists: a simple, keyboard-first way to plan your week around what matters.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One combined stylesheet, not three: each render-blocking cross-origin
      <link> costs its own round-trip before first paint, which dominates for
      the distant cold-cache visitors who see the worst LCP. css2 requires the
      family params in alphabetical order.

      Rubik is the body font (and so the LCP text); its axis is capped at 700
      because nothing uses 800/900 (heaviest in use: font-bold). Italic stays
      - LifeQuote renders one, and the description editor can mark any text
      italic.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Rubik:ital,wght@0,300..700;1,300..700&family=VT323&display=swap"
      rel="stylesheet"
    />

    <!--
      Bun names the src/index.tsx entrypoint's outputs after the entry file
      (/index.js + /index.css), so this file can reference them statically.
      copy-static-assets.ts asserts both exist at build time.

      The built copy of this file additionally gets modulepreload links for
      every boot-critical chunk, appended to head by inject-module-preloads.ts.
    -->
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
