name: Feature Request
description: You want something added to the app
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

  - type: textarea
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see added.
      placeholder: New Thing should work like this ...

  - type: textarea
    attributes:
      label: Use Case
      description: Explain the use case for this feature. How will it benefit users?
      placeholder: This'll save users time by ...

  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
      placeholder: |
        - Links to similar features in other apps
        - User research or feedback
        - Technical considerations
        - Screenshots or mockups

  - type: textarea
    id: agent_routing
    attributes:
      label: Agent routing (optional)
      description: Package scope and finish line if an agent should pick this
        up. Leave blank for a human-only issue.
      placeholder: |
        Package scope: web
        Finish line: ...
