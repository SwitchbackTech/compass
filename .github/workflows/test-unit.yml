name: Test

on:
  pull_request:
    branches:
      - main
  push:
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  # Required status checks cannot come from a workflow that path filtering
  # skipped: GitHub never creates the check run, so the context sits Pending
  # and a docs-only PR can never merge. A job skipped by an `if:` conditional
  # does report, and reports Success. So for pull_request the filter lives
  # here, as a job gate, not in `on:`. The push trigger keeps its
  # paths-ignore: push runs block nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-docs changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          # Keep these patterns in step with the push trigger's paths-ignore
          # above. Deliberately not `grep -q`: it exits on the first match, so
          # printf takes a SIGPIPE that `pipefail` would turn into a non-zero
          # pipeline on a large PR, reading as "docs only" and skipping the
          # suite on real code. Draining into a variable cannot do that.
          code_files=$(printf '%s\n' "$files" |
            grep -vE '(\.md$|^docs/|^\.gitignore$)' || true)
          # Fail open: an empty or unreadable list runs the suite rather than
          # waving an unverified change through.
          if [ -z "$files" ] || [ -n "$code_files" ]; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Non-docs changes: $code"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run lint
        run: |
          bun run lint

  knip:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      # Guards against dead-file/dead-export regrowth (scoped to files/exports —
      # dependency and type-only findings are noisier and out of scope here).
      - name: Run knip
        run: |
          bun run knip

  type-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run type-check
        run: |
          bun run type-check

  # A skipped MATRIX job collapses to one check run named `unit`, so the
  # required `unit (core)` ... `unit (scripts)` contexts would never report and
  # a docs-only PR would still be BLOCKED. Let the legs start and skip every
  # step instead: each reports its own name, in a few seconds, for free.
  unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [core, sync, web, backend, scripts]

    steps:
      - name: Check out Git repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Install Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          bun install --frozen-lockfile

      # backend and scripts boot an in-memory MongoDB; cache the downloaded
      # mongod binary so each run doesn't re-fetch it.
      - name: Cache MongoDB binaries
        if: needs.changes.outputs.code == 'true' && (matrix.project == 'backend' || matrix.project == 'scripts' || matrix.project == 'sync')
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-memory-server

      - name: Run web tests
        if: needs.changes.outputs.code == 'true' && (matrix.project == 'web')
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
        run: |
          bun run test:web

      - name: Run ${{ matrix.project }} tests
        if: needs.changes.outputs.code == 'true' && (matrix.project != 'web')
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
        run: |
          bun run test:${{ matrix.project }}
