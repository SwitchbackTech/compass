name: Unit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status checks cannot come from a workflow that path filtering
  # skipped: GitHub never creates the check run, so the context sits Pending
  # and a docs-only PR can never merge. A job skipped by an `if:` conditional
  # does report, and reports Success. So for pull_request the filter lives
  # here, as a job gate, not in `on:`. The push trigger keeps its
  # paths-ignore: push runs block nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Detect non-docs changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/detect-code-changes.sh \
            "${{ github.event_name }}" \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"

  # lint, knip, and type-check share node_modules and nothing else. One job
  # with three steps keeps failures attributable without paying checkout /
  # setup-bun / bun install three times. Bun-only: no actions/setup-node.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run lint
        run: |
          bun run lint

      # Guards against dead-file/dead-export regrowth (scoped to files/exports;
      # dependency and type-only findings are noisier and out of scope here).
      - name: Run knip
        run: |
          bun run knip

      - name: Cache TypeScript incremental build info
        uses: actions/cache@v5
        with:
          path: |
            **/*.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('bun.lock', 'tsconfig.json', 'tsconfig.typecheck.json', 'packages/**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('bun.lock') }}-

      - name: Run type-check
        run: |
          bun run type-check

  # A skipped MATRIX job collapses to one check run named `unit`, so the
  # required `unit (core)` ... `unit (web, 2)` contexts would never report and
  # a docs-only PR would still be BLOCKED. Let the legs start and skip every
  # step instead: each reports its own name, in a few seconds, for free.
  # Job display names are the required-check contexts: `unit (web, 1)` and
  # `unit (web, 2)` each run one half of the suite via WEB_TEST_SHARD_INDEX.
  unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: core
          - name: sync
            project: sync
          - name: web, 1
            project: web
            shard: "1"
          - name: web, 2
            project: web
            shard: "2"
          - name: backend
            project: backend
          - name: scripts
            project: scripts

    steps:
      - name: Check out Git repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Install Bun
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          bun install --frozen-lockfile

      # backend and scripts boot an in-memory MongoDB; cache the downloaded
      # mongod binary so each run doesn't re-fetch it.
      - name: Cache MongoDB binaries
        if: needs.changes.outputs.code == 'true' && (matrix.project == 'backend' || matrix.project == 'scripts' || matrix.project == 'sync')
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-memory-server

      - name: Run web tests
        if: needs.changes.outputs.code == 'true' && (matrix.project == 'web')
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
          WEB_TEST_SHARDS: "2"
          WEB_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          bun run test:web

      # 5 minutes is deliberate, and deliberately not raised. These suites run in
      # seconds on ubuntu-latest - scripts ~5s, backend ~13s, core ~2s, sync
      # ~105s at its slowest - so the budget is already an order of magnitude
      # clear of the slowest of them. When `scripts` tripped this on #3101 it was
      # not slow: every test passed, then the runner sat silent for five minutes
      # because a worker leaked an open Mongo handle and never exited. The same
      # commit re-ran in 5s. Raising the number would only have made that hang
      # cost ten minutes instead of five, while blinding the step to a real
      # regression. The leak itself is not fixed here - see test-mongo-env.ts,
      # which now kills a wedged run at 4 minutes and names the likely cause
      # instead of letting this timeout fire with no output.
      - name: Run ${{ matrix.project }} tests
        if: needs.changes.outputs.code == 'true' && (matrix.project != 'web')
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
        run: |
          bun run test:${{ matrix.project }}
