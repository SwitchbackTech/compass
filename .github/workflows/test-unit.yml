name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"
  push:
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run lint
        run: |
          bun run lint

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      # Guards against dead-file/dead-export regrowth (scoped to files/exports —
      # dependency and type-only findings are noisier and out of scope here).
      - name: Run knip
        run: |
          bun run knip

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run type-check
        run: |
          bun run type-check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [core, sync, web, backend, scripts]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      # backend and scripts boot an in-memory MongoDB; cache the downloaded
      # mongod binary so each run doesn't re-fetch it.
      - name: Cache MongoDB binaries
        if: matrix.project == 'backend' || matrix.project == 'scripts' || matrix.project == 'sync'
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-memory-server

      - name: Run web tests
        if: matrix.project == 'web'
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
        run: |
          bun run test:web

      - name: Run ${{ matrix.project }} tests
        if: matrix.project != 'web'
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
        run: |
          bun run test:${{ matrix.project }}
