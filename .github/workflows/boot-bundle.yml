name: Boot bundle

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
    paths:
      - "apps/calendar-web/**"
      - "packages/core/**"
      - "bun.lock"
      - ".github/perf/**"
      - ".github/docker/Dockerfile.web"
      - ".github/workflows/boot-bundle.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: boot-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      static_web: ${{ steps.filter.outputs.static_web }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Detect web blast-radius changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/detect-code-changes.sh \
            "${{ github.event_name }}" \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"

  delta:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.static_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Compare boot gzip vs merge base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bun .github/perf/pr-boot-size-delta.ts

      - name: Measure boot gzip on main
        if: github.event_name == 'push'
        env:
          COMPASS_BOOT_SIZE_ENFORCE: "0"
          COMPASS_BOOT_SIZE_METRICS_FILE: boot-main-metrics.json
        run: |
          .github/perf/run-boot-size-check.sh
          cat boot-main-metrics.json

  boot-bundle:
    needs: [changes, delta]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require boot bundle delta when web blast radius changed
        env:
          EVENT: ${{ github.event_name }}
          STATIC_WEB: ${{ needs.changes.outputs.static_web }}
          DELTA_RESULT: ${{ needs.delta.result }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$STATIC_WEB" != "true" ]; then
            echo "Skipped: no static web blast radius on this PR."
            exit 0
          fi
          case "$DELTA_RESULT" in
            success) ;;
            skipped)
              echo "Boot bundle delta job was skipped unexpectedly." >&2
              exit 1
              ;;
            *) exit 1 ;;
          esac
