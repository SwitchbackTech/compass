name: E2E

on:
  pull_request:
    branches:
      - main
  # Merge queue re-tests the combination against current main. Without this
  # trigger the required `e2e` check never runs on merge_group and the queue
  # stalls. Push to main remains the after-land safety net so a red e2e
  # cannot hide until the next PR opens.
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is fine, but two merges landing close together must
  # not cancel the first main run: a cancelled run reads as "not red" and
  # would recreate the blind spot this trigger exists to close.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status checks cannot come from a workflow that path filtering
  # skipped: GitHub never creates the check run, so the context sits Pending
  # and a docs-only PR can never merge. A job skipped by an `if:` conditional
  # does report, and reports Success. So for pull_request the filter lives
  # here, as a job gate, not in `on:`. The push trigger keeps its
  # paths-ignore: push runs block nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect non-docs changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/detect-code-changes.sh \
            "${{ github.event_name }}" \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"

  # Four shards of the same Playwright run, one worker each (see
  # playwright.config.ts for why one worker). One serial run of ~107 specs
  # was 6.5 minutes against an 8 minute step cap and the floor for every
  # PR-to-merge time on 2026-09-03. The required check is the `e2e` gate
  # below, so the shard legs can change count without touching branch
  # protection.
  # No display name: a skipped matrix collapses to one check whose name
  # would show the unexpanded ${{ matrix.shard }} expression.
  e2e-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      # Keep this tag aligned with the Playwright version in bun.lock.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Not oven-sh/setup-bun: on a cache miss it unzips the Bun release, and
      # the Playwright image has no unzip. The apt-get step that used to add it
      # pulled ~30 MB of package indexes from archive.ubuntu.com on every shard
      # and was the top e2e failure in the 2026-09 audit (p50 6s, p95 47s,
      # hangs to the 12-minute job timeout that surfaced as "cancelled"). The
      # npm package ships the binary as a platform package, so this needs only
      # the registry `bun install` already depends on. Keep the version equal
      # to the bun-version pin in test-unit.yml; `bun lint` checks it.
      - name: Install Bun
        timeout-minutes: 2
        run: |
          npm install --global --no-audit --no-fund bun@1.3.14
          bun --version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Playwright browser install
        timeout-minutes: 3
        run: bunx playwright install chromium

      - name: Run e2e tests
        timeout-minutes: 8
        env:
          TZ: Etc/UTC
          GOOGLE_CLIENT_ID: test-client-id
          API_BASEURL: http://localhost:3000/api
        run: bunx playwright test --shard=${{ matrix.shard }}/4

  # The one required status check. Reports success when every shard passed
  # or when the docs-only gate skipped them all, and fails on a shard
  # failure. A cancelled run (a newer push superseded it) is not a failure;
  # `!cancelled()` leaves it cancelled instead of painting the old head red.
  e2e:
    needs: [changes, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: ${RESULT}"
          case "$RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
