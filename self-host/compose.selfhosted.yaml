# Applied only when the selfhosted profile is active (see ./compass).
# Keeps cloud/Atlas deploys unchanged while giving local Mongo and Postgres
# time to recover after image updates.
services:
  backend:
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      start_period: 90s
      retries: 12

  mongo:
    stop_grace_period: 30s
    healthcheck:
      start_period: 60s
      retries: 12

  supertokens-db:
    stop_grace_period: 30s
    healthcheck:
      start_period: 60s
      retries: 12

  supertokens:
    healthcheck:
      start_period: 60s
      retries: 12
